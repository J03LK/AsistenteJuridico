# ============================================================
# docker-compose.yml — Asistente Jurídico IA
# Servicios base: PostgreSQL + Backend + Frontend
# ============================================================

services:

  # ── PostgreSQL 16 + pgvector ───────────────────────────────
  # Fase 8.1 (DA8-1): misma base postgres:16-alpine con pgvector compilado (docker/postgres/Dockerfile).
  # Cambio de imagen en entornos con datos: docs/FASE_8_CONTRATO.md §3.1.1. NUNCA usar `down -v`.
  postgres:
    build:
      context: ./docker/postgres
    image: asistente-juridico/postgres:16-alpine-pgvector0.8.7
    container_name: aj_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-asistente_juridico}
      POSTGRES_USER: ${POSTGRES_USER:-aj_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Solo accesible desde este equipo (no desde la red local)
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aj_user} -d ${POSTGRES_DB:-asistente_juridico}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - aj_network

  # ── Backend ASP.NET Core 10 ────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aj_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-asistente_juridico};Username=${POSTGRES_USER:-aj_user};Password=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}"
      Jwt__Key: ${JWT_SECRET:?Defina JWT_SECRET en .env}
      Cors__AllowedOrigins__0: "http://localhost:${FRONTEND_PORT:-4200}"
    ports:
      - "${BACKEND_PORT:-5000}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aj_network
    volumes:
      - backend_logs:/app/logs
      - backend_storage:/app/storage

  # ── Frontend Angular ───────────────────────────────────────
  # En desarrollo se usa ng serve directamente (ver override)
  # Este servicio es para producción

volumes:
  postgres_data:
    driver: local
  backend_logs:
    driver: local
  backend_storage:
    driver: local

networks:
  aj_network:
    driver: bridge
